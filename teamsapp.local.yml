# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
version: v1.11

environmentFolderPath: ./env

provision:
  - uses: teamsApp/create
    with:
      name: Campaign-${{TEAMSFX_ENV}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # 创建 Bot 的 Entra ID App Registration
  - uses: botAadApp/create
    with:
      name: Campaign-Bot-${{TEAMSFX_ENV}}
    writeToEnvironmentFile:
      botId: BOT_ID
      botPassword: SECRET_BOT_PASSWORD

  # 设置本地 Tab 域名和端口
  - uses: script
    with:
      run:
        echo "::set-teamsfx-env TAB_DOMAIN=localhost:3000";
        echo "::set-teamsfx-env TAB_ENDPOINT=https://localhost:3000";
        echo "::set-teamsfx-env BOT_ENDPOINT=https://placeholder.botframework.com";
        echo "::set-teamsfx-env BOT_DOMAIN=placeholder.botframework.com";

  # 在 Bot Framework 注册 Bot（本地使用 localhost，preview 时会自动创建 tunnel）
  - uses: botFramework/create
    with:
      botId: ${{BOT_ID}}
      name: Campaign-Bot-local
      messagingEndpoint: ${{BOT_ENDPOINT}}/api/messages
      description: Campaign Management Bot (Local)

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

deploy:
  - uses: devTool/install
    with:
      devCert:
        trust: true
    writeToEnvironmentFile:
      sslCertFile: SSL_CRT_FILE
      sslKeyFile: SSL_KEY_FILE

  - uses: cli/runNpmCommand
    name: install dependencies
    with:
      args: install

  - uses: file/createOrUpdateEnvironmentFile
    with:
      target: ./.localConfigs
      envs:
        PORT: 3000
        SSL_CRT_FILE: ${{SSL_CRT_FILE}}
        SSL_KEY_FILE: ${{SSL_KEY_FILE}}
        BOT_ID: ${{BOT_ID}}
        BOT_PASSWORD: ${{SECRET_BOT_PASSWORD}}
