# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
version: v1.11

environmentFolderPath: ./env

provision:
  - uses: teamsApp/create
    with:
      name: Campaign${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # 创建 Bot 的 Entra ID App Registration（不需要 Azure 订阅）
  - uses: botAadApp/create
    with:
      name: Campaign-Bot${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      botId: BOT_ID
      botPassword: SECRET_BOT_PASSWORD

  # 先设置域名和端点（botFramework/create 需要 BOT_ENDPOINT）
  - uses: script
    with:
      run: echo "::set-teamsfx-env TAB_DOMAIN=campaign.react.mobi"; echo
        "::set-teamsfx-env TAB_ENDPOINT=https://campaign.react.mobi"; echo
        "::set-teamsfx-env BOT_ENDPOINT=https://campaign.react.mobi"; echo
        "::set-teamsfx-env BOT_DOMAIN=campaign.react.mobi";

  # 在 Bot Framework 注册 Bot
  - uses: botFramework/create
    with:
      botId: ${{BOT_ID}}
      name: Campaign-Bot
      messagingEndpoint: ${{BOT_ENDPOINT}}/api/messages
      description: Campaign Management Bot

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
projectId: e806c8a0-f03d-4f17-9234-6e4f64b6840f
